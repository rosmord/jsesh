# properties applied to all actions (not menus)!
defaultAction.preconditions=DocumentEditor

# An entry for a menu heading.
# Note the name ending in "Menu".
fileMenu.Name=File
fileMenu.MnemonicKey=F
# The following action will call the "open" method on the target object.
# (which must have an "open" method, then !)
newDocument.Name=New
newDocument.AcceleratorKey=shortcut N
newDocument.preconditions=
newDocument.proxyMethod=getApplicationDelegate
openDocument.Name=Open
openDocument.preconditions=
openDocument.proxyMethod=getApplicationDelegate

saveDocument.Name=Save
saveDocumentAs.Name=Save As

closeDocument.Name=Close
closeDocument.AcceleratorKey=shortcut Q

# quitApplication uses the new, preferred lowerCamelCase suffixes (.text,
# .toolTipText, .accelerator) instead of the legacy .Name/.ShortDescription/
# .AcceleratorKey used by every other action in this file - both spellings
# are read by BundledActionFiller, with the new one preferred when present.
quitApplication.text=Quit
quitApplication.preconditions=
# Limit the use of this action in menus to Windows and Unix (not Mac).
# this key is currently dead: no Java code reads "MenuPlatform" (there is no matching
# constant or ACTION_KEYS entry), and the actual quitApplication/Mac exclusion
# is hardcoded in MenuFactory.addMenuLine instead. Left as PascalCase (not
# renamed to menuPlatform) until it's either wired up for real or dropped.
# quitApplication.MenuPlatform=Windows Unix
quitApplication.toolTipText=Exits !
# accelerator key. We might have "control X" here, but we
# "shortcut" maps to the command "apple" key on macs
# and on control on the other systems, thus providing better integration with
# the machine look and feel.
quitApplication.accelerator=shortcut X

editMenu.Name=Edit
undo.Name=Undo
undo.AcceleratorKey=shortcut Z
undo.preconditions=DocumentEditor, UndoPossible
redo.Name=Redo
redo.AcceleratorKey=shortcut Y
redo.preconditions=DocumentEditor, RedoPossible
cut.Name=Cut
cut.AcceleratorKey=shortcut X
copy.Name=Copy
copy.AcceleratorKey=shortcut C
paste.Name=Paste
paste.AcceleratorKey=shortcut V
windowMenu.Name=Window
hideWindow.Name=hide
bringEverythingToFront.Name=Bring everything to front
bringEverythingToFront.proxyMethod=getApplicationDelegate
bringEverythingToFront.preconditions=