<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A sign palette</title>
    <link rel="stylesheet" href="../examples.css" />
    <style>
      .chosen {
        min-height: 3rem;
        border: 1px solid #ccc;
        padding: 0.5rem;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>A sign palette</h1>
    <p>
      JSesh's sign palette: the <code>&lt;jsesh-palette&gt;</code> element of <code>@jsesh/palette</code>.
      Choose a family, then narrow it with tags, or search for a value (<i>nfr</i>, <i>m</i>) or a code
      (<i>A1</i>, <i>G17</i>). Click a sign to see what JSesh knows about it; double-click it (or press Enter) to
      choose it.
    </p>

    <jsesh-palette id="palette"></jsesh-palette>

    <h2>Chosen signs</h2>
    <div class="chosen"><jsesh-text id="chosen" cadrat-height="40"></jsesh-text></div>
    <p><code id="chosen-mdc"></code> <button id="clear-chosen">Clear</button></p>

    <script type="module">
      import { configureJSesh } from "@jsesh/elements";
      import "@jsesh/palette"; // defines <jsesh-palette>

      // The palette loads the sign database from the same place as the shapes.
      configureJSesh({ glyphsUrl: "/glyph-data/" });
      const palette = document.getElementById("palette");

      // A page uses the palette by listening to `sign-chosen`.
      const chosen = [];
      const show = () => {
        const mdc = chosen.join("-");
        document.getElementById("chosen").mdc = mdc;
        document.getElementById("chosen-mdc").textContent = mdc;
      };
      palette.addEventListener("sign-chosen", (e) => {
        chosen.push(e.detail);
        show();
      });
      document.getElementById("clear-chosen").addEventListener("click", () => {
        chosen.length = 0;
        show();
      });
    </script>
  </body>
</html>
